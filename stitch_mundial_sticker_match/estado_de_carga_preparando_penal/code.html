<style>
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.6; transform: scale(1); filter: blur(8px); }
            50% { opacity: 1; transform: scale(1.1); filter: blur(12px); }
        }
        .animate-pulse-glow {
            animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes slide-progress {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        .progress-glow {
            background: linear-gradient(90deg, transparent, #ffb3b1, transparent);
            animation: slide-progress 2s infinite linear;
        }
        .football-spin {
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>

<!-- Micro-interaction Script -->
<script>
        // Simulating progressive loading for visual feedback
        const progressBar = document.getElementById('progress-bar');
        let width = 65;
        
        const interval = setInterval(() => {
            if (width >= 98) {
                // Keep it at nearly full until redirect or success logic triggers
                width = 98;
            } else {
                width += (Math.random() * 2);
                progressBar.style.width = width + '%';
            }
        }, 800);

        // Simple atmospheric parallax on mouse move (desktop only)
        if (window.innerWidth > 1024) {
            document.body.addEventListener('mousemove', (e) => {
                const moveX = (e.clientX - window.innerWidth / 2) / 50;
                const moveY = (e.clientY - window.innerHeight / 2) / 50;
                const bgImage = document.querySelector('img');
                bgImage.style.transform = `scale(1.1) translate(${moveX}px, ${moveY}px)`;
            });
        }
    </script>
