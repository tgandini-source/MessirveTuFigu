<style>
        body {
            background-color: #131313;
            color: #e5e2e1;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .stadium-overlay {
            background: linear-gradient(to top, #131313 0%, rgba(19, 19, 19, 0.8) 40%, rgba(19, 19, 19, 0.2) 100%);
        }
        .pulse-glow {
            animation: pulse 3s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.4; filter: blur(8px); }
            50% { opacity: 0.8; filter: blur(12px); }
        }
    </style>
</head>
<body class="overflow-hidden">
<!-- Top AppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16 w-full border-b border-outline-variant dark:border-outline-variant bg-surface dark:bg-surface">
<div class="flex items-center gap-2 active:scale-95 transition-transform cursor-pointer">
<span class="material-symbols-outlined text-primary dark:text-primary">location_on</span>
<span class="font-headline-md text-headline-md font-black text-on-surface dark:text-on-surface">Pitch Side Trading</span>
</div>
<button class="material-symbols-outlined text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-high dark:hover:bg-surface-container-high transition-colors p-2 rounded-full">
            tune
        </button>
</header>
<!-- Main Canvas -->
<main class="relative h-screen w-full flex flex-col items-center justify-center pt-16 pb-20">
<!-- Background Cinematic Image -->
<div class="absolute inset-0 z-0 overflow-hidden">
<img alt="Cinematic empty stadium at night" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAqj6S5qOqB3aXWitD3W5yVjo_1HkFEvfYzzNBMKAWBBds1wn78kXu99b_WGraIvoovD-Jb_A7P7k5dyhb8MQvSESmD-h03nO46oPjZGlkEwZ1o4q-c9ZgNEsrDStc3YWAwjRVA7SZiVhHBU4Zd4JVMzLUGaR11chI0WdF-6v5_Ej--RJHkIf3zCsDRPO1gpydWJrdCJfRuMDZLx2CWatoEnjV7E8-OFgxV9w4jdw0iGlEZJxbx8M7oEdYyprwBHwZLnmjoUnOrujk"/>
<div class="absolute inset-0 stadium-overlay z-10"></div>
</div>
<!-- Content Overlay -->
<div class="relative z-20 flex flex-col items-center text-center px-6 max-w-lg">
<!-- Atmospheric Icon -->
<div class="relative mb-stack-lg">
<div class="absolute inset-0 bg-primary-container opacity-40 blur-xl rounded-full pulse-glow"></div>
<div class="relative bg-surface-container-high p-6 rounded-full border border-outline-variant">
<span class="material-symbols-outlined text-primary text-5xl" style="font-variation-settings: 'opsz' 48;">search_off</span>
</div>
</div>
<!-- Typography -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile mb-stack-sm text-on-surface uppercase tracking-tighter">
                ¡Estadio Silencioso!
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed mb-stack-lg">
                No hay coleccionistas cerca en este momento. Intenta ampliar tu radio de búsqueda o vuelve más tarde.
            </p>
<!-- Action Button -->
<button class="group relative flex items-center gap-3 bg-on-surface text-surface py-4 px-8 rounded-xl active:scale-95 transition-all duration-200 shadow-2xl overflow-hidden">
<div class="absolute inset-0 bg-primary opacity-0 group-hover:opacity-10 transition-opacity"></div>
<span class="material-symbols-outlined font-bold">radar</span>
<span class="font-headline-md text-headline-md font-extrabold uppercase tracking-tight">Expandir Búsqueda</span>
</button>
<button class="mt-stack-md font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors py-2 px-4">
                CONFIGURAR NOTIFICACIONES
            </button>
</div>
<!-- Quick Status Mini-Card (Decorative Context) -->
<div class="absolute bottom-28 left-6 right-6 md:left-auto md:right-12 md:w-64 z-30">
<div class="bg-surface-container-low/80 backdrop-blur-md p-stack-md rounded-xl border border-outline-variant flex items-center gap-4">
<div class="w-12 h-12 rounded-lg bg-surface-container-highest flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant">satellite_alt</span>
</div>
<div>
<div class="text-[10px] font-label-caps text-tertiary uppercase">Rastreo Activo</div>
<div class="font-body-md text-sm text-on-surface">Radio: 500m</div>
</div>
</div>
</div>
</main>
<!-- Bottom Navigation Shell -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-gutter py-stack-sm bg-surface-container-low shadow-lg rounded-t-xl z-50">
<!-- Explore (Active based on intent) -->
<button class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary-container text-on-primary-container dark:text-on-primary-container rounded-full p-3 active:scale-90 transition-transform duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">style</span>
</button>
<!-- Social/Trending -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant p-3 hover:bg-surface-container-high dark:hover:bg-surface-container-high rounded-full transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined">local_fire_department</span>
</button>
<!-- Profile -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant p-3 hover:bg-surface-container-high dark:hover:bg-surface-container-high rounded-full transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined">person</span>
</button>
<!-- Chat -->
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant p-3 hover:bg-surface-container-high dark:hover:bg-surface-container-high rounded-full transition-all active:scale-90 duration-200">
<span class="material-symbols-outlined">chat</span>
</button>
</nav>
<script>
        // Interactive Hover Effect for the button
        const button = document.querySelector('button.group');
        button.addEventListener('mousemove', (e) => {
            const rect = button.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            button.style.setProperty('--x', `${x}px`);
            button.style.setProperty('--y', `${y}px`);
        });

        // Simple scale interaction for all nav items
        document.querySelectorAll('nav button').forEach(btn => {
            btn.addEventListener('click', function() {
                // Remove active from all
                document.querySelectorAll('nav button').forEach(b => {
                    b.className = "flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant p-3 hover:bg-surface-container-high dark:hover:bg-surface-container-high rounded-full transition-all active:scale-90 duration-200";
                    b.querySelector('span').style.fontVariationSettings = "'FILL' 0";
                });
                // Add to clicked
                this.className = "flex flex-col items-center justify-center bg-primary-container dark:bg-primary-container text-on-primary-container dark:text-on-primary-container rounded-full p-3 active:scale-90 transition-transform duration-200";
                this.querySelector('span').style.fontVariationSettings = "'FILL' 1";
            });
        });
    </script>
</body></html>
