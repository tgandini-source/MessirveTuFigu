<script>
        const card = document.getElementById('active-card');
        const container = document.getElementById('swipe-container');
        let isDragging = false;
        let startX, currentX;

        card.addEventListener('mousedown', startDrag);
        card.addEventListener('touchstart', startDrag);

        window.addEventListener('mousemove', drag);
        window.addEventListener('touchmove', drag);

        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);

        function startDrag(e) {
            isDragging = true;
            startX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            card.style.transition = 'none';
        }

        function drag(e) {
            if (!isDragging) return;
            currentX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            const deltaX = currentX - startX;
            const rotation = deltaX / 20;
            card.style.transform = `translateX(${deltaX}px) rotate(${rotation}deg)`;

            // Visual feedback
            if (deltaX > 50) {
                card.style.borderColor = '#95d4b3'; // Tertiary Green
            } else if (deltaX < -50) {
                card.style.borderColor = '#ff535b'; // Primary Red
            } else {
                card.style.borderColor = 'rgba(171, 137, 135, 0.5)';
            }
        }

        function endDrag() {
            if (!isDragging) return;
            isDragging = false;
            const deltaX = currentX - startX;

            if (Math.abs(deltaX) > 150) {
                // Swipe out
                const direction = deltaX > 0 ? 1 : -1;
                card.style.transition = 'transform 0.5s cubic-bezier(0.65, 0, 0.35, 1)';
                card.style.transform = `translateX(${direction * 1000}px) rotate(${direction * 45}deg)`;
                
                // Reset card after animation (simulate new card)
                setTimeout(() => {
                    card.style.transition = 'none';
                    card.style.transform = 'translateX(0) rotate(0)';
                    card.style.borderColor = 'transparent';
                    setTimeout(() => {
                        card.style.transition = 'transform 0.3s ease-out';
                    }, 50);
                }, 600);
            } else {
                // Return to center
                card.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                card.style.transform = 'translateX(0) rotate(0)';
                card.style.borderColor = 'transparent';
            }
        }

        // Button Click Animations
        document.getElementById('btn-skip').addEventListener('click', () => {
            card.style.transition = 'transform 0.5s ease-in';
            card.style.transform = 'translateX(-1000px) rotate(-45deg)';
            setTimeout(() => {
                card.style.transition = 'none';
                card.style.transform = 'translateX(0) rotate(0)';
            }, 600);
        });

        document.getElementById('btn-like').addEventListener('click', () => {
            card.style.transition = 'transform 0.5s ease-in';
            card.style.transform = 'translateX(1000px) rotate(45deg)';
            setTimeout(() => {
                card.style.transition = 'none';
                card.style.transform = 'translateX(0) rotate(0)';
            }, 600);
        });
    </script>
